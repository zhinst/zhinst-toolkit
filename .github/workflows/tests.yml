name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: py310
          python-version: "3.10"
        - name: py311
          python-version: "3.11"
          coverage: true
        - name: py312
          python-version: "3.12"
        - name: py313
          python-version: "3.13"
        - name: py314
          python-version: "3.14"
        - name: py315
          python-version: "3.15"
    steps:
    - uses: actions/checkout@v7
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run:  pip install -r requirements.txt
    - name: Run tests
      run:  hatch run +py=${{ matrix.python-version }} test:cov
    - name: Upload coverage reports to Codecov
      if: matrix.coverage
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        # Forks get no secrets, so only fail on main where the token is required.
        fail_ci_if_error: ${{ github.event_name == 'push' }}